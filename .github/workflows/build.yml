name: "Build Binaries"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libjpeg-dev libpng-dev libwebp-dev libtiff-dev libheif-dev zlib1g-dev

      - name: Get ImageMagick
        id: im
        run: echo "sha=$(git rev-parse HEAD:libs/ImageMagick)" >> "$GITHUB_OUTPUT"

      - name: Cache ImageMagick
        id: im-cache
        uses: actions/cache@v4
        with:
          path: build/install
          key: imagemagick-${{ runner.os }}-${{ steps.im.outputs.sha }}-${{ hashFiles('scripts/build-imagemagick.sh') }}

      - name: Build ImageMagick
        if: steps.im-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-imagemagick.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-gnu/release/image_converter image_converter-linux
          strip image_converter-linux
          if ldd image_converter-linux | grep "not found"; then exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: image_converter-linux
          path: image_converter-linux

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ImageMagick
        run: brew install imagemagick pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release

      - name: Package
        run: |
          cp target/release/image_converter image_converter-macos
          strip image_converter-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: image_converter-macos
          path: image_converter-macos
